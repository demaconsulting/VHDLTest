<svg xmlns="http://www.w3.org/2000/svg" width="1076" height="400" viewBox="0 0 1076 400" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <!-- Transparent canvas; a white rounded card keeps the diagram readable in light and dark themes -->
  <rect x="14" y="16" width="1050" height="378" rx="28" fill="#d5dce6"/>
  <rect x="10" y="10" width="1050" height="378" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <g transform="translate(30,34)">
    <!-- Step 1: prepare -->
    <rect x="0" y="0" width="230" height="306" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="115" y="30" font-size="16" font-weight="600" fill="#1e3a8a" text-anchor="middle">1. Write your tests</text>
    <rect x="14" y="46" width="202" height="54" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="115" y="68" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">VHDL design files</text>
    <text x="115" y="88" font-size="12" fill="#1e40af" text-anchor="middle">the .vhd sources under test</text>
    <rect x="14" y="110" width="202" height="54" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="115" y="132" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">VHDL test benches</text>
    <text x="115" y="152" font-size="12" fill="#1e40af" text-anchor="middle">assertions check the behavior</text>
    <rect x="14" y="174" width="202" height="54" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="115" y="196" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">YAML test configuration</text>
    <text x="115" y="216" font-size="12" font-family="Consolas, monospace" fill="#1e40af" text-anchor="middle">files: and tests: lists</text>
    <rect x="14" y="238" width="202" height="54" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="115" y="260" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="middle">Installed simulator</text>
    <text x="115" y="280" font-size="12" fill="#1e40af" text-anchor="middle">on PATH or VHDLTEST_*_PATH</text>

    <line x1="234" y1="153" x2="256" y2="153" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <!-- Step 2: run -->
    <rect x="260" y="0" width="230" height="306" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="375" y="30" font-size="16" font-weight="600" fill="#92400e" text-anchor="middle">2. Run VHDLTest</text>
    <rect x="274" y="46" width="202" height="54" rx="6" fill="#ffffff" stroke="#d97706"/>
    <text x="375" y="68" font-size="14" font-weight="600" font-family="Consolas, monospace" fill="#92400e" text-anchor="middle">vhdltest CLI</text>
    <text x="375" y="88" font-size="12" font-family="Consolas, monospace" fill="#92400e" text-anchor="middle">--config tests.yaml</text>
    <rect x="274" y="110" width="202" height="54" rx="6" fill="#ffffff" stroke="#d97706"/>
    <text x="375" y="132" font-size="14" font-weight="600" font-family="Consolas, monospace" fill="#92400e" text-anchor="middle">--simulator</text>
    <text x="375" y="152" font-size="12" fill="#92400e" text-anchor="middle">or use the first one installed</text>
    <rect x="274" y="174" width="202" height="54" rx="6" fill="#ffffff" stroke="#d97706"/>
    <text x="375" y="196" font-size="14" font-weight="600" font-family="Consolas, monospace" fill="#92400e" text-anchor="middle">[tests]</text>
    <text x="375" y="216" font-size="12" fill="#92400e" text-anchor="middle">optionally run only named benches</text>
    <rect x="274" y="238" width="202" height="54" rx="6" fill="#ffffff" stroke="#d97706"/>
    <text x="375" y="260" font-size="14" font-weight="600" fill="#92400e" text-anchor="middle">Compile, then simulate</text>
    <text x="375" y="280" font-size="12" fill="#92400e" text-anchor="middle">each test bench in turn</text>

    <line x1="494" y1="153" x2="516" y2="153" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <!-- Step 3: outputs -->
    <rect x="520" y="0" width="230" height="306" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="635" y="30" font-size="16" font-weight="600" fill="#5b21b6" text-anchor="middle">3. Get the outputs</text>
    <rect x="534" y="46" width="202" height="54" rx="6" fill="#ffffff" stroke="#7c3aed"/>
    <text x="635" y="68" font-size="14" font-weight="600" fill="#4c1d95" text-anchor="middle">Pass / fail per test bench</text>
    <text x="635" y="88" font-size="12" fill="#5b21b6" text-anchor="middle">plus a console summary</text>
    <rect x="534" y="110" width="202" height="54" rx="6" fill="#ffffff" stroke="#7c3aed"/>
    <text x="635" y="132" font-size="14" font-weight="600" fill="#4c1d95" text-anchor="middle">TRX test results</text>
    <text x="635" y="152" font-size="12" font-family="Consolas, monospace" fill="#5b21b6" text-anchor="middle">--results out.trx</text>
    <rect x="534" y="174" width="202" height="54" rx="6" fill="#ffffff" stroke="#7c3aed"/>
    <text x="635" y="196" font-size="14" font-weight="600" fill="#4c1d95" text-anchor="middle">JUnit XML test results</text>
    <text x="635" y="216" font-size="12" font-family="Consolas, monospace" fill="#5b21b6" text-anchor="middle">--results out.xml</text>
    <rect x="534" y="238" width="202" height="54" rx="6" fill="#ffffff" stroke="#7c3aed"/>
    <text x="635" y="260" font-size="14" font-weight="600" fill="#4c1d95" text-anchor="middle">Pass / fail exit code</text>
    <text x="635" y="280" font-size="12" fill="#5b21b6" text-anchor="middle">non-zero on build or test failure</text>

    <line x1="754" y1="153" x2="776" y2="153" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

    <!-- Step 4: use -->
    <rect x="780" y="0" width="230" height="306" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="895" y="30" font-size="16" font-weight="600" fill="#166534" text-anchor="middle">4. Use them</text>
    <rect x="794" y="46" width="202" height="54" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="895" y="68" font-size="14" font-weight="600" fill="#14532d" text-anchor="middle">CI gate</text>
    <text x="895" y="88" font-size="12" fill="#166534" text-anchor="middle">fail the build on a failing bench</text>
    <rect x="794" y="110" width="202" height="54" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="895" y="132" font-size="14" font-weight="600" fill="#14532d" text-anchor="middle">CI test reports</text>
    <text x="895" y="152" font-size="12" fill="#166534" text-anchor="middle">GitHub, Azure DevOps, Jenkins</text>
    <rect x="794" y="174" width="202" height="54" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="895" y="196" font-size="14" font-weight="600" fill="#14532d" text-anchor="middle">Test evidence</text>
    <text x="895" y="216" font-size="12" fill="#166534" text-anchor="middle">standard results on every CI run</text>
    <rect x="794" y="238" width="202" height="54" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="895" y="260" font-size="14" font-weight="600" fill="#14532d" text-anchor="middle">Pull request checks</text>
    <text x="895" y="280" font-size="12" fill="#166534" text-anchor="middle">test every commit before merging</text>

    <text x="505" y="336" font-size="13" font-style="italic" fill="#475569" text-anchor="middle">Need tool qualification evidence? Run vhdltest --validate --simulator mock --results validation.trx</text>
  </g>
</svg>
